[project]
name = "migration-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",  # for OpenRouter (OpenAI-compatible)
    "langchain-groq>=0.2",
    "voyageai>=0.3",
    "qdrant-client[fastembed]>=1.12",
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",  # bundles parsers for 100+ languages
    "tree-sitter-typescript>=0.23",  # JS/TS dep extraction in JSDepExtractor
    "astchunk @ git+https://github.com/yilinjz/astchunk.git",
    "rerankers[transformers]>=0.6",
    "networkx>=3.4",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "loguru>=0.7",
    "langfuse>=2.55",
    "httpx>=0.27",
    "rank-bm25>=0.2",
    "jinja2>=3.1",  # for HTMX dashboard
    "pygit2>=1.16",  # programmatic git operations
    "pathspec>=0.12",  # .gitignore-aware file walking
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"