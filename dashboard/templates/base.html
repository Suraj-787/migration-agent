<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Migration Agent{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.1/sse.js"></script>
  <style>
    /* difflib HtmlDiff table styles */
    table.diff { font-family: monospace; font-size: 0.8rem; border-collapse: collapse; width: 100%; }
    table.diff td, table.diff th { padding: 2px 6px; white-space: pre; }
    .diff_header { background-color: #374151; color: #9ca3af; }
    td.diff_header { text-align: right; }
    .diff_next { background-color: #1f2937; color: #6b7280; }
    .diff_add { background-color: #14532d; color: #bbf7d0; }
    .diff_chg { background-color: #713f12; color: #fef3c7; }
    .diff_sub { background-color: #7f1d1d; color: #fecaca; }
    .diff_default { background-color: #111827; color: #e5e7eb; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-mono text-sm">
  <nav class="border-b border-gray-700 px-6 py-3 flex items-center gap-6">
    <a href="/dashboard/" class="text-indigo-400 font-bold tracking-wide hover:text-indigo-300">
      Migration Agent
    </a>
    <span class="text-gray-600">/</span>
    {% block breadcrumb %}{% endblock %}
  </nav>
  <main class="px-6 py-6 max-w-7xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
